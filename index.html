<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ค้นหาคำศัพท์แยกตามหมวดหมู่</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-6">
    <!-- ขยายความกว้างเป็น max-w-6xl เพื่อแสดงผลแนวนอนเต็มหน้าจอคอม -->
    <div class="max-w-6xl mx-auto p-6 bg-white min-h-screen sm:min-h-fit sm:my-4 rounded-2xl shadow-sm border border-slate-100">
        
        <!-- Top Section: Header & Search Bar จัดวางคู่กันในแนวนอนบนจอคอม -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-slate-100 mb-6">
            <div class="flex items-center gap-3">
                <div class="h-12 w-12 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-2xl shadow-sm shrink-0">
                    หม
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-slate-900">ค้นหาคำศัพท์แยกตามหมวดหมู่</h1>
                    <p class="text-xs sm:text-sm text-slate-500">พิมพ์ตัวอักษรขึ้นต้นเพื่อค้นหาคำศัพท์ในหมวดต่าง ๆ (<span id="categoryCountBadge" class="font-semibold text-indigo-600">0</span> หมวดหมู่)</p>
                </div>
            </div>

            <!-- Search Box -->
            <div class="w-full md:w-96">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </span>
                    <input type="text" id="searchInput" maxlength="50" placeholder="พิมพ์ตัวอักษรขึ้นต้น (เช่น น, ก, ป)..." class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                    <button id="clearBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Results Header -->
        <div class="flex justify-between items-center mb-4">
            <span class="text-sm font-semibold text-slate-700">ผลการค้นหาแยกตามหมวดหมู่ (เรียงจากซ้ายไปขวา)</span>
            <span id="resultCount" class="text-xs font-medium px-3 py-1 bg-indigo-50 text-indigo-700 rounded-full">พิมพ์ค้นหาเพื่อเริ่มใช้งาน</span>
        </div>

        <!-- Results Grid: แสดงผลแนวนอนจากซ้ายไปขวา (มือถือ 1 คอลัมน์, แท็บเล็ต 2, คอม 3-4 คอลัมน์) -->
        <div id="resultsList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <div class="col-span-full text-center py-16 text-slate-400 text
