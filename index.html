        document.getElementById('categoryCountBadge').innerText = categoriesData.length;
        const totalWords = categoriesData.reduce((sum, cat) => sum + cat.words.length, 0);
        document.getElementById('totalWordsBadge').innerText = totalWords.toLocaleString();

        const searchInput = document.getElementById('searchInput');
        const resultsList = document.getElementById('resultsList');
        const resultCount = document.getElementById('resultCount');
        const clearBtn = document.getElementById('clearBtn');

        searchInput.addEventListener('input', () => {
            clearBtn.classList.toggle('hidden', searchInput.value.length === 0);
            handleSearch();
        });

        function clearSearch() {
            searchInput.value = '';
            clearBtn.classList.add('hidden');
            handleSearch();
        }

        function handleSearch() {
            const query = searchInput.value.trim();
            if (!query) {
                resultsList.innerHTML = '<div class="col-span-full text-center py-16 text-slate-400 text-sm bg-slate-50 rounded-xl border border-dashed border-slate-200">พิมพ์ตัวอักษรขึ้นต้นในช่องค้นหาด้านบน (เช่น ห, ก, ส, ม) เพื่อแสดงผลลัพธ์เรียงจากซ้ายไปขวา</div>';
                resultCount.innerText = 'พิมพ์ตัวอักษรขึ้นต้นเพื่อค้นหา';
                return;
            }

            let matchedCategories = 0;
            let htmlContent = '';

            categoriesData.forEach(cat => {
                // 1. คัดกรองเฉพาะคำที่ "ขึ้นต้นด้วย" ตัวอักษรที่พิมพ์เท่านั้น
                let matchedWords = cat.words.filter(word => word.startsWith(query));
                
                if (matchedWords.length > 0) {
                    matchedCategories++;
                    
                    // 2. เรียงลำดับให้คำที่ตรงตัวและสั้นกระชับขึ้นก่อน ตามด้วยตัวอักษรไทย
                    matchedWords.sort((a, b) => a.length - b.length || a.localeCompare(b, 'th'));

                    // แสดงสูงสุด 8 คำต่อหมวดเพื่อความกระชับ ไม่บังสายตา
                    const wordBadges = matchedWords.slice(0, 8).map(w => 
                        `<span class="inline-block px-2.5 py-1 bg-indigo-50/70 hover:bg-indigo-100 text-slate-800 border border-indigo-100 rounded-lg text-xs font-medium transition-colors">${w}</span>`
                    ).join('');
                    
                    const extraBadge = matchedWords.length > 8 
                        ? `<span class="inline-block px-2 py-1 text-slate-400 text-xs">+อีก ${matchedWords.length - 8} คำ</span>` 
                        : '';

                    htmlContent += `
                        <div class="p-4 bg-white border border-slate-200 rounded-xl shadow-sm hover:border-indigo-400 hover:shadow-md transition-all flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
                                    <h3 class="font-bold text-indigo-950 text-base">📁 ${cat.name}</h3>
                                    <span class="text-xs px-2.5 py-0.5 bg-indigo-600 text-white rounded-full font-semibold">${matchedWords.length} คำ</span>
                                </div>
                                <div class="flex flex-wrap gap-1.5">
                                    ${wordBadges}
                                    ${extraBadge}
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            resultCount.innerText = `พบใน ${matchedCategories} หมวดหมู่`;

            if (matchedCategories === 0) {
                resultsList.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400 text-sm bg-slate-50 rounded-xl border border-dashed border-slate-200">ไม่พบคำที่ขึ้นต้นด้วย "<strong>${query}</strong>" ในทุกหมวดหมู่</div>`;
                return;
            }

            resultsList.innerHTML = htmlContent;
        }
    </script>
